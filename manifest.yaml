id: lightning-jet
title: Lightning Jet
version: 1.7.0.1
release-notes: |
  * Clear old active rebalance registrations before starting Jet. Completed rebalances and their paid fees carry over.
  * Update Lightning Jet to 1.7.0 and run it on Node.js 22.
  * Automated rebalances now default to a 100,000-sat fee cap over a rolling 24 hours. This also applies to existing configurations that omit rebalancer.maxDailyFee. Set it to 0 to disable the cap.
  * Jet now keeps its configuration and database on the StartOS data volume. Before updating from 1.6.0.3, follow the carryover instructions while the old container is running. The existing data format is compatible.
license: mit
wrapper-repo: "https://github.com/bobodread876/lightning-jet-startos"
upstream-repo: "https://github.com/drneski/lightning-jet"
support-site: "https://github.com/drneski/lightning-jet/issues"
marketing-site: "https://github.com/drneski"
donation-url: "https://t.me/lnjet"
build: ["make"]
description:
  short: Fully automated rebalancer for LND Lightning nodes
  long: Fully automated rebalancer for LND Lightning nodes. Helps get an insight into peers classification based on routing history, missed routing opportunities, and stuck htlcs.
assets:
  license: LICENSE
  icon: icon.png
  instructions: instructions.md
main:
  type: docker
  image: main
  entrypoint: docker_entrypoint.sh
  args: []
  mounts:
    main: /root
    lnd: /mnt/lnd
health-checks: {}
config:
  get:
    type: script
  set:
    type: script
volumes:
  main:
    type: data
  lnd:
    type: pointer
    package-id: lnd
    volume-id: main
    path: "/public"
    readonly: true
interfaces: {}
dependencies:
  lnd:
    version: ">=0.17.0 <0.20.0"
    requirement:
      type: required
    config: ~
alerts:
  install: |
    READ CAREFULLY! This is command-line ONLY tool. You will be required to use an SSH Key to gain access to the command line. Please refer to the Using SSH guide (https://start9.com/latest/user-manual/ssh) for setup instructions.
backup:
  create:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - create
      - /mnt/backup
      - /root/data
    mounts:
      BACKUP: "/mnt/backup"
      main: "/root/data"
  restore:
    type: docker
    image: compat
    system: true
    entrypoint: compat
    args:
      - duplicity
      - restore
      - /mnt/backup
      - /root/data
    mounts:
      BACKUP: "/mnt/backup"
      main: "/root/data"
migrations:
  from:
    "*":
      type: script
      args: ["from"]
  to:
    "*":
      type: script
      args: ["to"]
